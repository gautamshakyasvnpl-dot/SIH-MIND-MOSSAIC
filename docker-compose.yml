version: "3.9"

services:
  api:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/sahaik.db
      UPLOAD_DIR: /data/uploads
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - sahaik-data:/data
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8000
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  sahaik-data:
